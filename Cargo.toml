[package]
name = "autumn-plugin-pingora"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
license = "Apache-2.0"
description = "Pingora reverse proxy for Autumn: routes, load balancing, health checks, app fallback, metrics and graceful drain"
repository = "https://github.com/autumn-foundation/autumn-plugin-pingora"
readme = "README.md"
keywords = ["pingora", "autumn", "proxy", "gateway", "plugin"]
categories = ["web-programming::http-server", "network-programming"]
exclude = [".github/", "docs/"]

[dependencies]
# `ws` gives `AppState::shutdown_token` (ADR 0003). Cargo unifies features
# with the host app.
autumn-web = { version = "0.7", default-features = false, features = ["ws"] }
async-trait = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
pingora-core = { version = "0.9", default-features = false }
pingora-error = "0.9"
pingora-http = "0.9"
pingora-load-balancing = { version = "0.9", default-features = false }
pingora-proxy = { version = "0.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "net", "rt", "macros"] }
tokio-util = "0.7"
toml = "1.1"
tracing = "0.1"

[dev-dependencies]
axum = "0.8"
proptest = "1"
socket2 = "0.6"
toml = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
tokio = { version = "1", features = ["full"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
module_name_repetitions = "allow"
